# Codeception Test Suite Configuration
# suite for unit (internal) tests.
# cleanup: false — tests reset the dedicated test DB themselves (tests/Support/Factory::reset),
# and the code under test uses its own transactions, which must not be nested in Codeception's.
actor: UnitTester
modules:
  enabled:
    - Asserts
    - Yii2:
        part: [orm, email, fixtures]
        cleanup: false
        transaction: false
