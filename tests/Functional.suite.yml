# Codeception Test Suite Configuration
# suite for functional (integration) tests: emulate web requests through the Yii application.
# Tests reset the dedicated test DB themselves (tests/Support/Factory::reset).
# The app instance is reused between requests in a test (keeps the login), so components that
# hold per-request state are recreated: response (format), view (breadcrumbs/registered assets).
actor: FunctionalTester
modules:
  enabled:
    - Filesystem
    - Yii2:
        cleanup: false
        transaction: false
        responseCleanMethod: force_recreate
        recreateComponents: [view]
    - Asserts
